# SEC-2: Local DEVELOPMENT compose — in-memory store, DEBUG on.
# Data is NOT durable; this profile is for local development only.
# For a durable, production-like stack use:  docker compose -f docker-compose.prod.yml up
services:
  muressons:
    build: .
    ports:
      - "3000:3000"   # Frontend
    environment:
      - USE_MEMORY_DB=true
      - DEBUG=true
      - NODE_ENV=development
    restart: unless-stopped
