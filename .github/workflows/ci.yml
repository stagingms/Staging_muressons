name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (runtime + test)
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        env:
          USE_MEMORY_DB: "true"
          DEBUG: "true"
        run: python -m pytest tests/ -q

  # ── Postgres parity — the deploy gate ────────────────────────────────────
  # The memory-mode job above cannot see Postgres-only defects: the
  # fn_immutable_guard trigger 500'd CEO-Interview saves and Double-Materiality
  # submissions IN PRODUCTION while 1,485 memory-mode tests stayed green,
  # because triggers only exist on the real database. This job runs the exact
  # production configuration (USE_MEMORY_DB=false against real PostgreSQL) over
  # the flows that broke. Enable "Wait for CI" on the Railway service so a
  # deploy cannot start until this passes.
  backend-postgres:
    name: Backend — Postgres parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muressons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (runtime + test)
        run: pip install -r backend/requirements-dev.txt
      - name: Run Postgres parity suite
        working-directory: backend
        env:
          PG_PARITY: "1"
          USE_MEMORY_DB: "false"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/muressons
          DEBUG: "true"
          MASTER_PASSWORD: sim2026@iim   # test-only credential, matches conftest
        run: |
          # The parity flows that broke in production...
          python -m pytest tests/test_postgres_parity.py -q -p no:randomly
          # ...plus the characterization + safety-net suites, run against REAL
          # Postgres. CI-2 (2026-08-02): production is Postgres and every other
          # job runs in memory mode, so the goldens, the route guards and the
          # full-run HTTP game had only ever been verified on a backend
          # production does not use. The two stores differ in ways that reach
          # the engine — Postgres returns BUs ORDER BY bu_id while the memory
          # store returns creation order, and the engine indexes into that list
          # positionally (engine.py micro-strike) — so a green memory run is
          # not evidence about the deployed system.
          python -m pytest \
            tests/test_financial_golden_trace.py \
            tests/test_stakeholder_golden_trace.py \
            tests/test_treasury_waterfall.py \
            tests/test_full_run_e2e.py \
            tests/test_admin_route_guards.py \
            tests/test_phase0_run_day_fixes.py \
            tests/test_config_introspect.py \
            tests/test_join_password_not_bypassable.py \
            -q -p no:randomly

  frontend-tests:
    name: Frontend — jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend — next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ── Dependency advisories — the drift tripwire (F-22/F-23, 2026-08-04) ────
  # The failure mode this prevents: the pre-class register recorded "4 npm
  # vulns" and "Starlette CVEs". A week later it was 16 advisories across 3
  # DIFFERENT python packages, and the npm four had become four OTHER ones in
  # sharp/libvips. Nobody had changed a dependency — the advisory database had
  # moved underneath a static document. A register cannot track this; only a
  # job that re-asks on every push can.
  #
  # Thresholds differ on purpose:
  #   pip-audit  — fails on ANY advisory. The backend dependency list is short,
  #                pinned, and every package is reachable from a public route.
  #   npm audit  — `--omit=dev` then high+. Dev tooling drags in a long tail of
  #                transitive advisories that never reach a user's browser;
  #                failing on those trains people to ignore the job, which is
  #                worse than not having it. Runtime deps at high severity are
  #                the signal worth stopping for.
  # Both were at ZERO when this job was added, so a red run means something
  # genuinely changed.
  dependency-audit:
    name: Dependencies — advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend runtime pins)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend runtime deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
