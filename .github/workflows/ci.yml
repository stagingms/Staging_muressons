name: CI

# Q-1 (REVIEW_Muressons_Comprehensive_v4.md): the release gate the repo lacked.
# 1,018 backend tests + 63 frontend tests existed but nothing ran them on merge;
# the Fable5-v2 review found red engine tests only by running pytest by hand.
# This workflow runs on every push and PR — red blocks merge once branch
# protection requires these checks (see repo Settings → Branches; that step is
# a GitHub UI action, not something this file can set).

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # matches the Dockerfile base image
          cache: pip
      - name: Install deps (runtime + test)
        run: pip install -r backend/requirements-dev.txt
      - name: Run pytest
        working-directory: backend         # so db/ resolves at __file__.parent.parent
        env:
          USE_MEMORY_DB: "true"            # conftest also sets this; explicit for clarity
        run: python -m pytest tests/ -q

  frontend-tests:
    name: Frontend — jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"               # matches the Dockerfile frontend stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend — next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
